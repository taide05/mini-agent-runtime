name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent_runtime_test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install fastapi uvicorn[standard] sqlalchemy psycopg2-binary redis httpx pydantic pydantic-settings python-dotenv sse-starlette
          pip install pytest pytest-asyncio

      - name: Run unit tests
        env:
          POSTGRES_DSN: postgresql+psycopg2://agent:agent@localhost:5432/agent_runtime_test
          REDIS_URL: redis://localhost:6379/0
        run: python -m pytest tests/unit/ -v
